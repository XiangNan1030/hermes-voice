model:
  api_key: __API_KEY__
  base_url: https://api.deepseek.com/v1
  default: deepseek-v4-pro
  provider: deepseek
agent:
  max_turns: 90
  tool_use_enforcement: auto
terminal:
  backend: local
  timeout: 180
compression:
  enabled: true
  threshold: 0.5
display:
  language: zh
memory:
  memory_enabled: true
  user_profile_enabled: true
delegation:
  max_iterations: 50
approvals:
  mode: manual
security:
  redact_secrets: true
tts:
  provider: edge
stt:
  enabled: true
  provider: local
onboarding:
  seen:
    api_key: true
    welcome: true
mcp_servers:
  windows_desktop:
    command: "__PYTHON__"
    args:
      - "__MCP_SCRIPT__"
    timeout: 30
_config_version: 24
